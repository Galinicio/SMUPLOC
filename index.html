<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMUPLOC — Painel Holográfico & Radar AR</title>
  
  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <!-- Leitor jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
    
    /* ⚡ HUD Superior */
    #hud {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 999;
      background: rgba(10, 20, 30, 0.88); backdrop-filter: blur(8px); color: #fff;
      padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.4);
      box-shadow: 0 8px 32px rgba(0, 255, 204, 0.15);
    }
    .hud-header { display: flex; justify-content: space-between; align-items: center; }
    .hud-title { font-weight: 700; color: #00ffcc; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .status-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc; }
    
    /* 🛰️ MINI RADAR HUD (Canto Inferior Esquerdo) */
    #radar-container {
      position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; z-index: 999;
      background: rgba(5, 15, 25, 0.88); border: 2px solid #00ffcc; border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    #radar-label { position: absolute; bottom: 6px; font-size: 9px; color: #00ffcc; font-weight: bold; letter-spacing: 1px; }
  </style>
</head>
<body>

  <!-- HUD Bar -->
  <div id="hud">
    <div class="hud-header">
      <span class="hud-title">⚡ SMUPLOC — TELEMETRIA & MAPEAMENTO</span>
      <span id="status-badge" class="status-badge">ÂNCORA ATIVA 🟢</span>
    </div>
    <div id="qr-data" style="font-size: 11px; color: #ccc; margin-top: 4px;">Escaneando sensores e equipamentos da SMUP...</div>
  </div>

  <!-- Radar HUD -->
  <div id="radar-container">
    <canvas id="radar-canvas" width="120" height="120"></canvas>
    <div id="radar-label">RADAR X-Z</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 📍 ÂNCORA PRINCIPAL (QR CODE LIDO) -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      
      <!-- 1. Anel Holográfico Giratório na Base -->
      <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.3" 
              material="color: #00ffcc; shader: flat; opacity: 0.8;"
              animation="property: rotation; to: -90 360 0; loop: true; dur: 6000; easing: linear">
      </a-ring>
      
      <!-- 2. Haste Conectora de Luz Neon -->
      <a-cylinder position="0 0.3 0" radius="0.006" height="0.6" material="color: #00ffcc; shader: flat; opacity: 0.7;"></a-cylinder>

      <!-- 3. PAINEL HOLOGRÁFICO PRINCIPAL 3D (No centro da âncora) -->
      <a-entity position="0 0.75 0">
        <!-- Fundo de Vidro Escuro -->
        <a-plane width="1.2" height="0.75" material="color: #05101a; opacity: 0.85; transparent: true; side: double;"></a-plane>
        <!-- Borda Glowing Cyan -->
        <a-plane width="1.24" height="0.79" position="0 0 -0.001" material="color: #00ffcc; opacity: 0.9; shader: flat; side: double;"></a-plane>
        
        <a-text value="SMUP TELEMETRIA" position="0 0.26 0.01" scale="0.4 0.4 0.4" align="center" color="#00ffcc" bold="true"></a-text>
        <a-plane position="0 0.2 0.01" width="1.0" height="0.008" material="color: #00ffcc; shader: flat;"></a-plane>

        <a-text id="ar-card-body" 
                value="EQUIPAMENTO: AGUARDANDO\n--------------------\nTEMP: -- °C\nUMIDADE: --%\nSTATUS: MONITORANDO" 
                position="0 -0.05 0.01" scale="0.32 0.32 0.32" align="center" color="#ffffff">
        </a-text>
      </a-entity>

      <!-- 🎯 MARCADOR MAPEADO 1: Geladeira (X: 1.5m Direita | Z: -2.5m Frente) -->
      <a-entity position="1.5 0.4 -2.5">
        <a-cylinder position="0 -0.2 0" radius="0.005" height="0.4" material="color: #00ffcc; shader: flat;"></a-cylinder>
        <a-plane width="0.8" height="0.4" material="color: #05101a; opacity: 0.85; transparent: true; side: double;"></a-plane>
        <a-plane width="0.83" height="0.43" position="0 0 -0.001" material="color: #00ffcc; opacity: 0.8; shader: flat; side: double;"></a-plane>
        <a-text value="GELADEIRA 01 (Toxicologia)\n--------------------\nTEMP: 4.2 °C | OK" position="0 0 0.01" scale="0.25 0.25 0.25" align="center" color="#ffffff"></a-text>
      </a-entity>

      <!-- 🎯 MARCADOR MAPEADO 2: Freezer (X: -1.8m Esquerda | Z: -4.0m Frente) -->
      <a-entity position="-1.8 0.4 -4.0">
        <a-cylinder position="0 -0.2 0" radius="0.005" height="0.4" material="color: #ffaa00; shader: flat;"></a-cylinder>
        <a-plane width="0.8" height="0.4" material="color: #05101a; opacity: 0.85; transparent: true; side: double;"></a-plane>
        <a-plane width="0.83" height="0.43" position="0 0 -0.001" material="color: #ffaa00; opacity: 0.8; shader: flat; side: double;"></a-plane>
        <a-text value="FREEZER 02 (Reativos)\n--------------------\nTEMP: -18.5 °C | OK" position="0 0 0.01" scale="0.25 0.25 0.25" align="center" color="#ffffff"></a-text>
      </a-entity>

    </a-entity>
  </a-scene>

  <canvas id="qr-canvas" style="display:none;"></canvas>

  <script>
    // 1. Leitura de QR Code via Câmera
    setInterval(() => {
      const video = document.querySelector('video');
      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      const canvas = document.getElementById('qr-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

      if (code && code.data) {
        document.getElementById('qr-data').innerHTML = `<b>QR Code Lido:</b> ${code.data}`;
        const arBody = document.getElementById('ar-card-body');
        if (arBody) {
          arBody.setAttribute('value', 
            `TAG: ${code.data.substring(0, 24)}\n` +
            `--------------------\n` +
            `TEMP: 4.2 °C (IDEAL)\n` +
            `UMIDADE: 54%\n` +
            `SISTEMA: OPERACIONAL`
          );
        }
      }
    }, 400);

    // 2. Loop do Mini Radar 2D
    const radarCanvas = document.getElementById('radar-canvas');
    const ctxRadar = radarCanvas.getContext('2d');
    const equipamentos = [
      { nome: "Geladeira 01", x: 1.5, z: -2.5, cor: "#00ffcc" },
      { nome: "Freezer 02", x: -1.8, z: -4.0, cor: "#ffaa00" }
    ];

    function desenharRadar() {
      const cx = 60, cy = 60, escala = 10;
      ctxRadar.clearRect(0, 0, 120, 120);

      // Círculos e Grade
      ctxRadar.strokeStyle = "rgba(0, 255, 204, 0.25)";
      ctxRadar.lineWidth = 1;
      ctxRadar.beginPath(); ctxRadar.arc(cx, cy, 25, 0, 2 * Math.PI); ctxRadar.stroke();
      ctxRadar.beginPath(); ctxRadar.arc(cx, cy, 50, 0, 2 * Math.PI); ctxRadar.stroke();
      ctxRadar.beginPath(); ctxRadar.moveTo(cx, 0); ctxRadar.lineTo(cx, 120); ctxRadar.stroke();
      ctxRadar.beginPath(); ctxRadar.moveTo(0, cy); ctxRadar.lineTo(120, cy); ctxRadar.stroke();

      // Centro (Você / QR Âncora)
      ctxRadar.fillStyle = "#ffffff";
      ctxRadar.beginPath(); ctxRadar.arc(cx, cy, 3.5, 0, 2 * Math.PI); ctxRadar.fill();

      // Blips dos Equipamentos
      equipamentos.forEach(eq => {
        const px = cx + (eq.x * escala);
        const py = cy + (eq.z * escala);

        ctxRadar.fillStyle = eq.cor;
        ctxRadar.beginPath(); ctxRadar.arc(px, py, 4.5, 0, 2 * Math.PI); ctxRadar.fill();
        ctxRadar.strokeStyle = eq.cor;
        ctxRadar.lineWidth = 1.5;
        ctxRadar.beginPath(); ctxRadar.arc(px, py, 7.5, 0, 2 * Math.PI); ctxRadar.stroke();
      });

      requestAnimationFrame(desenharRadar);
    }
    desenharRadar();
  </script>

</body>
</html>
